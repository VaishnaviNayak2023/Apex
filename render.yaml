services:
  - type: web
    name: apexa-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile.api
    dockerContext: .
    numInstances: 1
    healthCheckPath: /api/health
    envVars:
      - key: RACE_STORAGE_DIR
        value: /app/data
      - key: RACE_DB_PATH
        value: /app/data/processed/race_registry.sqlite
      - key: RACE_MODEL_DIR
        value: /app/data/models
      - key: RACE_LEDGER_DIR
        value: /app/data/predictions/ledger
      - key: ALLOW_DEMO_DATA
        value: "false"
      - key: DASHBOARD_API_TOKEN
        generateValue: true

  - type: web
    name: apexa-web
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile.web
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: RACE_API_URL
        value: https://apexa-api.onrender.com
      - key: DASHBOARD_API_TOKEN
        fromService:
          type: web
          name: apexa-api
          envVarKey: DASHBOARD_API_TOKEN
